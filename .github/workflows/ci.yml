name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint + imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: ruff check
        run: ruff check app tests vercel_entry.py
      - name: ruff format --check
        run: ruff format --check app tests vercel_entry.py
        continue-on-error: true

  tests:
    name: Pytest (py3.12 / py3.13)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        env:
          BOT_TOKEN: 123456:CI_TEST
          DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
          LOG_LEVEL: WARNING
        run: python -m pytest -q --tb=short

  migrations:
    name: Alembic scenarios (fresh/legacy/idempotent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fresh upgrade + idempotent rerun
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./mi_0.db"
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
      - name: ensure_schema (fresh / legacy / no-version / again)
        env:
          BOT_TOKEN: 123456:CI_TEST
          LOG_LEVEL: WARNING
        run: python scripts/check_migrations.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: textfixerbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vercel-entrypoint:
    name: Serverless entrypoint smoke
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: import vercel_entry (export app)
        env:
          BOT_TOKEN: 123456:CI_TEST
          DATABASE_URL: "sqlite+aiosqlite:///./smoke.db"
          LOG_LEVEL: WARNING
        run: python -c "import vercel_entry; assert callable(vercel_entry.app)"

  validate-vercel-json:
    name: Validate vercel.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import json; json.load(open('vercel.json'))"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, tests, migrations, docker, vercel-entrypoint, validate-vercel-json]
    if: always()
    steps:
      - run: echo "CI finished — ${{ job.status }}"
