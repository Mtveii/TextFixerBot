services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./data.db:/app/data.db
    # Для режима WEBHOOK раскомментировать (и задать WEBHOOK_URL в .env):
    # ports:
    #   - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # NOTE: по умолчанию DATABASE_URL=sqlite (data.db) — postgres/redis не нужны.
  # postgres стартует только с --profile postgres, порты наружу не торчат (только 127.0.0.1).
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_please}
      POSTGRES_DB: sayitbetter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # не открывать наружу — только localhost
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    ports:
      # не открывать наружу — только localhost
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
